name: Automated Freebies Scraper

on:
  schedule:
    # Runs daily at 00:00 UTC (7:00 PM EST / 8:00 PM EDT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run multi-source scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run fetch-freebies

      - name: Commit and push updated deals data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/data/aggregatedDeals.json
          
          if git diff --staged --quiet; then
            echo "No new deal updates found."
          else
            git commit -m "chore(data): auto-update aggregated freebies data [skip ci]"
            git push origin main
          fi
